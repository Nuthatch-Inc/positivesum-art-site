name: Deploy Positive Sum Art preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Read pinned source commit
        id: source
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < source-ref.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          repository: Nuthatch-Inc/nuthatch-desktop
          ref: ${{ steps.source.outputs.ref }}
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build project-path preview
        working-directory: source
        run: npm run build:positivesum -- --base /positivesum-art-site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist/positivesum

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
